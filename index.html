<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddha Parking - A Unit of Pakka Traders</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --royal-yellow: #d4af37;
            --dark-blue: #0d1b2a;
            --bg-light: #f4f6f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 15px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 6px solid var(--royal-yellow);
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-green);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        header h1 {
            margin: 5px 0 0 0;
            font-size: 22px;
            color: var(--dark-blue);
        }
        header p {
            margin: 2px 0;
            font-size: 12px;
            color: #666;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: var(--primary-green);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .login-box {
            text-align: center;
            padding: 30px 10px;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .red-light { background-color: #e53935; box-shadow: 0 0 8px #e53935; }
        .green-light { background-color: #43a047; box-shadow: 0 0 8px #43a047; }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border-left: 5px solid var(--primary-green);
        }
        .action-btns {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .action-btns button {
            margin: 0;
            padding: 8px;
            font-size: 13px;
        }
        .whatsapp-btn { background-color: #25d366; }
        .whatsapp-btn:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <!-- लॉगिन स्क्रीन -->
    <div class="container login-box" id="loginBox">
        <img src="logo.jpg" alt="Buddha Parking Logo" width="80" style="margin-bottom: 10px;">
        <h2>बुद्धा पार्किंग (पक्का ट्रेडर्स)</h2>
        <p>कृपया स्टाफ या एडमिन पासवर्ड दर्ज करें</p>
        <input type="password" id="passInput" placeholder="पासवर्ड दर्ज करें (जैसे: 1234 या 9999)">
        <button onclick="login()">लॉगिन करें</button>
        <p style="font-size: 11px; color: #888; margin-top: 15px;">स्टाफ पास: 1234 | एडमिन पास: 9999</p>
    </div>

    <!-- मेन ऐप डैशबोर्ड -->
    <div class="container" id="appBox" style="display:none;">
        <header>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="logo.png" alt="Logo" width="45">
                <h1>बुद्धा पार्किंग</h1>
            </div>
            <p>A Unit of Pakka Traders | EV Charging & Parking</p>
        </header>

        <div id="userInfo" style="font-size: 13px; color: #555; margin-bottom: 10px; text-align: right; font-weight: bold;"></div>

        <h3>नई गाड़ी एंट्री फॉर्म</h3>
        <input type="text" id="vehNo" placeholder="गाड़ी नंबर (उदा: BR01AB1234)">
        <input type="text" id="ownerName" placeholder="ओनर का नाम">
        <input type="tel" id="mob1" placeholder="मोबाइल नंबर 1 (ओनर)">
        <input type="tel" id="mob2" placeholder="मोबाइल नंबर 2 (वैकल्पिक/घर का)">

        <label style="font-size: 13px; font-weight: bold; color: #444;">रेट / सर्विस टाइप:</label>
        <select id="serviceType">
            <option value="20">नॉर्मल पार्किंग (₹20)</option>
            <option value="100">EV चार्जिंग - 1 दिन / वन नाईट (₹100)</option>
            <option value="80">EV चार्जिंग - विशेष (₹80)</option>
            <option value="70">EV चार्जिंग - विशेष (₹70)</option>
            <option value="2400">मंथली पास (₹2400)</option>
            <option value="2500">मंथली पास (₹2500)</option>
        </select>

        <input type="number" id="manualAmount" placeholder="या अपनी मर्जी का राशि टाइप करें (Optional)">
        
        <label style="font-size: 13px; font-weight: bold; color: #444;">अगली फॉलो-अप तारीख (कब आएंगे?):</label>
        <input type="date" id="followUpDate">

        <label style="font-size: 13px; font-weight: bold; color: #444;">चार्जिंग फुल होने का अनुमानित समय:</label>
        <input type="datetime-local" id="chargeTime">

        <button onclick="saveEntry()">डेटा सेव करें & WhatsApp भेजें</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <h3>गाड़ी खोजें या रिकॉर्ड देखें</h3>
        <input type="text" id="searchQuery" placeholder="गाड़ी नंबर, ओनर का नाम या मोबाइल से खोजें..." onkeyup="searchVehicle()">

        <div id="resultArea"></div>
        
        <button onclick="logout()" style="background-color: #d32f2f; margin-top: 20px;">लॉग आउट</button>
    </div>

    <script>
        let currentRole = "";

        function login() {
            let pass = document.getElementById('passInput').value;
            if(pass === "9999") {
                currentRole = "Admin";
                document.getElementById('userInfo').innerText = "लॉग इन: एडमिन (पिंटू जी)";
                startApp();
            } else if(pass === "1234") {
                currentRole = "Staff";
                document.getElementById('userInfo').innerText = "लॉग इन: स्टाफ";
                startApp();
            } else {
                alert("गलत पासवर्ड! कृपया सही पासवर्ड (1234 या 9999) डालें।");
            }
        }

        function startApp() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('appBox').style.display = 'block';
            loadRecords();
        }

        function logout() {
            document.getElementById('appBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('passInput').value = "";
        }

        function saveEntry() {
            let veh = document.getElementById('vehNo').value.trim();
            let name = document.getElementById('ownerName').value.trim();
            let mob1 = document.getElementById('mob1').value.trim();
            let mob2 = document.getElementById('mob2').value.trim();
            let serviceRate = document.getElementById('serviceType').value;
            let manualAmt = document.getElementById('manualAmount').value;
            let finalAmount = manualAmt ? manualAmt : serviceRate;
            let followDate = document.getElementById('followUpDate').value;
            let chargeTime = document.getElementById('chargeTime').value;

            if(!veh || !mob1) {
                alert("कृपया गाड़ी नंबर और कम से कम ओनर का मोबाइल नंबर जरूर भरें!");
                return;
            }

            let records = JSON.parse(localStorage.getItem('buddhaParkingData')) || [];
            let dateStr = new Date().toLocaleDateString('hi-IN');
            let timeStr = new Date().toLocaleTimeString('hi-IN');

            let newRecord = {
                id: Date.now(),
                vehicle: veh,
                owner: name || 'अज्ञात',
                mobile1: mob1,
                mobile2: mob2 || 'उपलब्ध नहीं',
                amount: finalAmount,
                date: dateStr,
                time: timeStr,
                followUp: followDate || 'तय नहीं',
                chargeTarget: chargeTime,
                charged: false
            };

            records.unshift(newRecord);
            localStorage.setItem('buddhaParkingData', JSON.stringify(records));

            alert("डेटा सफलतापूर्वक सुरक्षित हो गया!");
            
            // WhatsApp संदेश भेजना
            let msg = `नमस्ते ${name} जी, बुद्धा पार्किंग (पक्का ट्रेडर्स) में आपकी गाड़ी (${veh}) की एंट्री दर्ज हो गई है। शुल्क: ₹${finalAmount} | दिनांक: ${dateStr}. धन्यवाद!`;
            let url = `https://wa.me/91${mob1}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');

            clearForm();
            loadRecords();
        }

        function clearForm() {
            document.getElementById('vehNo').value = '';
            document.getElementById('ownerName').value = '';
            document.getElementById('mob1').value = '';
            document.getElementById('mob2').value = '';
            document.getElementById('manualAmount').value = '';
            document.getElementById('followUpDate').value = '';
            document.getElementById('chargeTime').value = '';
        }

        function loadRecords() {
            let records = JSON.parse(localStorage.getItem('buddhaParkingData')) || [];
            displayResults(records);
        }

        function searchVehicle() {
            let query = document.getElementById('searchQuery').value.toLowerCase();
            let records = JSON.parse(localStorage.getItem('buddhaParkingData')) || [];
            
            if(!query) {
                displayResults(records);
                return;
            }

            let matched = records.filter(r => 
                r.vehicle.toLowerCase().includes(query) || 
                r.owner.toLowerCase().includes(query) || 
                r.mobile1.includes(query)
            );
            displayResults(matched);
        }

        function displayResults(dataList) {
            let resultDiv = document.getElementById('resultArea');
            if(dataList.length === 0) {
                resultDiv.innerHTML = "<p style='color:#777; text-align:center;'>कोई रिकॉर्ड नहीं मिला।</p>";
                return;
            }

            let html = "<h4 style='margin-top:15px;'>गाड़ियों का हालिया रिकॉर्ड:</h4>";
            dataList.forEach(m => {
                let now = new Date();
                let targetTime = m.chargeTarget ? new Date(m.chargeTarget) : null;
                let isFull = targetTime && now >= targetTime;
                let lightClass = isFull ? "green-light" : "red-light";
                let statusText = isFull ? "चार्ज फुल (Green)" : "चार्जिंग जारी (Red)";

                html += `
                    <div class="card">
                        <p style="margin:2px 0;"><b>🚗 गाड़ी नंबर:</b> <span style="font-size:16px; color:#d32f2f;">${m.vehicle}</span></p>
                        <p style="margin:2px 0;"><b>👤 ओनर:</b> ${m.owner} | <b>📞 मो.1:</b> ${m.mobile1} | <b>📞 घर का मो.2:</b> ${m.mobile2}</p>
                        <p style="margin:2px 0;"><b>💰 राशि:</b> ₹${m.amount} | <b>📅 दिनांक:</b> ${m.date} (${m.time})</p>
                        <p style="margin:2px 0;"><b>⏰ अगली तारीख (Follow-up):</b> ${m.followUp}</p>
                        <p style="margin:2px 0;"><b>⚡ चार्जिंग स्टेटस:</b> <span class="indicator ${lightClass}"></span> ${statusText}</p>
                        <div class="action-btns">
                            <button onclick="callCustomer('${m.mobile1}')">📞 कॉल करें</button>
                            <button class="whatsapp-btn" onclick="whatsappCustomer('${m.mobile1}', '${m.vehicle}', '${m.amount}')">💬 WhatsApp</button>
                            ${currentRole === 'Admin' ? `<button style="background-color:#d32f2f;" onclick="deleteRecord(${m.id})">❌ डिलीट</button>` : ''}
                        </div>
                    </div>
                `;
            });
            resultDiv.innerHTML = html;
        }

        function callCustomer(phone) {
            window.location.href = `tel:${phone}`;
        }

        function whatsappCustomer(phone, veh, amt) {
            let msg = `नमस्ते, बुद्धा पार्किंग (पक्का ट्रेडर्स) से आपकी गाड़ी (${veh}) के संबंध में संपर्क किया जा रहा है। बकाया/शुल्क: ₹${amt}।`;
            let url = `https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function deleteRecord(id) {
            if(confirm("क्या आप वाकई इस रिकॉर्ड को डिलीट करना चाहते हैं?")) {
                let records = JSON.parse(localStorage.getItem('buddhaParkingData')) || [];
                records = records.filter(r => r.id !== id);
                localStorage.setItem('buddhaParkingData', JSON.stringify(records));
                loadRecords();
            }
        }
    </script>
</body>
</html>
